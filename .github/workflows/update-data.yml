name: Actualizar datos C-F Explore

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consultar NOAA y SNGR
        run: node scripts/update-data.mjs
      - name: Guardar cambios
        run: |
          if git diff --quiet -- public/data; then
            echo "No hay cambios en las fuentes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "data: actualización automática"
          git push
