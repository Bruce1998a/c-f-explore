name: Publicar C-F Explore en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Actualizar datos C-F Explore"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar compilación estática
        run: mv app/api api-source
      - name: Generar sitio
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: '/c-f-explore'
          NEXT_PUBLIC_SITE_URL: 'https://bruce1998a.github.io/c-f-explore/'
        run: pnpm run build:github
      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
